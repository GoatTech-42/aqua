name: Aqua bounded qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aqua-bounded-qualification
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout frozen private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8d803fe5a95e4137b373b244b56888e468caef76
          persist-credentials: false
          fetch-depth: 1
      - name: Verify and apply accepted source deltas
        shell: bash
        run: |
          python3 - <<'PYPREP'
          import pathlib,hashlib,json,base64,gzip,subprocess
          base={'.gitignore': '44c92e3a70ad3307b7056871c2bdb096d8bfa9373f5bf06a79bb6324a20ff2fb', 'Cargo.lock': '1435649f00d3ff1052d738b574f4a79fbb43d8ff7ed06ae9d04e28b6b2880db6', 'Cargo.toml': '2ad9ae494acba6dc4da9386adffbe81e649aedde7077e1061d18fc3009dfd855', 'README.md': '88ab449f5fe62706ab6438c5e54f3bd7de0ee0e6a88f818f68465fd78d1b7d9a', 'docs/AUTH.md': '6a3ee12c6c9de94f3e96167ac43331f7779142b4b37c7d8b52387e9a318cd38b', 'src/auth.rs': 'bbd1a0d3ab7895ecfab2667bf1e9e5695a4cae7e618c2f66c92d026ef1b2f009', 'src/config.rs': '254317ec6000b860243a4e61f2e74dd3f1ee6bab8f4cf8d6b26e92dc2984336a', 'src/lib.rs': '4da43347b25975a4754fee6f381b82e3c816b0c25c867f27de91773d700fe351', 'src/main.rs': 'd74fc20394b64953b8ea6108513b43c9b07e361e4a9498d9cb19dff048c1083f', 'src/redact.rs': 'a1d4de7854107cc7ee5673eb4fcf84ec553939124bffce16c81bfa14832a5988', 'src/server.rs': '0080ba7a9070a5130b07a150b6d656232d09ce1fa2ba36a38f6411e794a32fbf', 'src/sse.rs': 'a9f70f4208b310290830529bb517d9545d95c6d04b1b0b23ac781548817f4c41', 'tests/auth.rs': '001a968ed533d2c6b416588aee69073dc5a5fbe501db030a2a95c71853824d18', 'tests/proxy.rs': '8467777e2ca10ea851d436cd4c889b839d9830a019ba4af1df1ec7b1a1572962', 'ui/README.md': '26394c00ff91019c8a8045e4dd50e329fc6d57a740ef4bd83f309b5cc6efeab8', 'ui/console.html': '27d2858d886e0d09aeb032bf04ebbbd050b4ff4a5248368f481fe697b65f922e', 'ui/landing.html': 'a9c9a63f507811295def40b298d8c1ed870c74efb6df798c90faa6ca48d21eed', 'ui/playground.html': '0169c21365954f6f99da69a8e26c548598f57d17be4c9daad6969462f2097df4'}
          final={'.gitignore': '44c92e3a70ad3307b7056871c2bdb096d8bfa9373f5bf06a79bb6324a20ff2fb', 'Cargo.lock': '1435649f00d3ff1052d738b574f4a79fbb43d8ff7ed06ae9d04e28b6b2880db6', 'Cargo.toml': '2ad9ae494acba6dc4da9386adffbe81e649aedde7077e1061d18fc3009dfd855', 'README.md': 'c96bea05f07ef430c584511e55c6c33bd5a612cc3ed82c1cfaab066bc848c977', 'docs/AUTH.md': '6a3ee12c6c9de94f3e96167ac43331f7779142b4b37c7d8b52387e9a318cd38b', 'src/auth.rs': 'bbd1a0d3ab7895ecfab2667bf1e9e5695a4cae7e618c2f66c92d026ef1b2f009', 'src/config.rs': '845e0139d713becd8b9cef5b6df9c4ce480b0f0d83304e61a64c8805d6dd05c3', 'src/lib.rs': '51a4330f791ca5dd1db6d1d02e08d82e211319640b8c9b6e547d19cd32205927', 'src/main.rs': 'd74fc20394b64953b8ea6108513b43c9b07e361e4a9498d9cb19dff048c1083f', 'src/redact.rs': 'a1d4de7854107cc7ee5673eb4fcf84ec553939124bffce16c81bfa14832a5988', 'src/server.rs': 'fd580b25d173348242f3da12a47859c41cde23a881940d1986584d08a75de485', 'src/sse.rs': 'bf934a3e616687838d73372504bcb3a2fa89f18d313911c68e35fa2e3e9e08f5', 'tests/auth.rs': '3da7154c04816bf09c3b4a367109e5f9127f5ec1d426739e72b9f8853872697c', 'tests/proxy.rs': '3b17b2ef3323b14b64ac12e714bc6f29573439f640b83ba7aef1967258af202b', 'tests/routing.rs': '5b448a9fbffb1b0efed3edbb3d5f7ab85a67c13e89031b921cce1ed409256fce', 'ui/README.md': '26394c00ff91019c8a8045e4dd50e329fc6d57a740ef4bd83f309b5cc6efeab8', 'ui/console.html': '27d2858d886e0d09aeb032bf04ebbbd050b4ff4a5248368f481fe697b65f922e', 'ui/landing.html': 'a9c9a63f507811295def40b298d8c1ed870c74efb6df798c90faa6ca48d21eed', 'ui/playground.html': '0169c21365954f6f99da69a8e26c548598f57d17be4c9daad6969462f2097df4'}
          diffs=[('8bbf78b30384ece5b9180b8eb59979272cc4e7accd57942b2d539dad677c9d9e', ''), ('87a97e4f0b94f164a184d0529b5d96c2f0e812d1842f62262a5c5490f75a5674', '')]
          out=pathlib.Path('ci-source');out.mkdir()
          for n,h in base.items():
           b=pathlib.Path(n).read_bytes();assert hashlib.sha256(b).hexdigest()==h,n
           q=out/n;q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(b)
          for i,(h,b64) in enumerate(diffs):
           b=gzip.decompress(base64.b64decode(b64));assert hashlib.sha256(b).hexdigest()==h
           q=pathlib.Path('ci-diff-'+str(i));q.write_bytes(b)
           subprocess.run(['git','apply','--check',str(q.resolve())],cwd=out,check=True)
           subprocess.run(['git','apply',str(q.resolve())],cwd=out,check=True)
          a={str(x.relative_to(out)):hashlib.sha256(x.read_bytes()).hexdigest()for x in out.rglob('*')if x.is_file()}
          assert a==final,'successor manifest mismatch'
          pathlib.Path('source-receipt.json').write_text(json.dumps({'baseline':'8d803fe5a95e4137b373b244b56888e468caef76','diff_sha256':[h for h,b in diffs],'manifest':a},sort_keys=True))
          PYPREP
      - name: Bounded test and release build
        shell: bash
        run: |
          set -eu
          mkdir ci-out
          sudo mount -t tmpfs -o size=16777216,mode=0777 tmpfs "$PWD/ci-out"
          cp source-receipt.json ci-out/
          IMAGE='rust@sha256:7c7d4eb4d05b7781187a327809466cfddf29753f6defdc3d19a0e291951b7a37'
          docker pull "$IMAGE"
          timeout --signal=TERM --kill-after=15s 900 docker run --name aqua-ci-bounded --pull never --log-driver none  --user 10001:10001 --read-only --cap-drop ALL --security-opt no-new-privileges:true  --memory 3g --memory-swap 3g --cpus 2 --pids-limit 256 --ulimit core=0  --tmpfs /work:rw,exec,nosuid,nodev,size=2147483648,mode=1777  --tmpfs /tmp:rw,noexec,nosuid,nodev,size=134217728,mode=1777  --mount type=bind,src="$PWD/ci-source",dst=/src,readonly  --mount type=bind,src="$PWD/ci-out",dst=/out  --env CARGO_HOME=/work/cargo --env CARGO_TARGET_DIR=/work/target --env CARGO_BUILD_JOBS=2 --env RUST_TEST_THREADS=2  --workdir /src --entrypoint /bin/sh "$IMAGE" -ec '
            cargo test --locked -- --test-threads=2 > /work/test.log 2>&1
            cargo build --release --locked >> /work/test.log 2>&1
            strip /work/target/release/aqua
            test "$(stat -c%s /work/target/release/aqua)" -le 8388608
            cp /work/target/release/aqua /out/aqua
            tail -c 1048576 /work/test.log > /out/test.log
            rustc -Vv > /out/toolchain.txt
            sha256sum /out/aqua > /out/SHA256SUMS
           '
          python3 - <<'PYRECEIPT'
          import pathlib,hashlib,json,subprocess,os
          p=pathlib.Path('ci-out');s=json.loads(subprocess.check_output(['docker','inspect','aqua-ci-bounded']))[0]
          assert s['State']['ExitCode']==0 and not s['State']['Running'] and not s['State']['OOMKilled']
          assert (s['HostConfig']['Memory'],s['HostConfig']['MemorySwap'],s['HostConfig']['NanoCpus'],s['HostConfig']['PidsLimit'])==(3221225472,3221225472,2000000000,256)
          t=(p/'test.log').read_text();assert 'test result: FAILED' not in t
          import re
          counts=[int(n)for n in re.findall(r'test result: ok\. (\d+) passed;',t)];assert sum(counts)==84,counts
          r={'binary_sha256':hashlib.sha256((p/'aqua').read_bytes()).hexdigest(),'test_count':sum(counts),'image_id':s['Image'],'image_ref':s['Config']['Image'],'exit':s['State']['ExitCode'],'oom':s['State']['OOMKilled'],'run_id':os.environ['GITHUB_RUN_ID'],'workflow_sha':os.environ['GITHUB_SHA'],'memory_limit':3221225472,'cpu_limit':2,'tmpfs_work_bytes':2147483648,'output_tmpfs_bytes':16777216}
          (p/'build-receipt.json').write_text(json.dumps(r,sort_keys=True))
          assert sum(x.stat().st_size for x in p.iterdir())<10485760
          PYRECEIPT
      - name: Upload bounded private artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aqua-qualified-linux-x64
          path: ci-out/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
